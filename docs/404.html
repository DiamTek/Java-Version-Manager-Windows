<!DOCTYPE html>

  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    (function() {
      var path = window.location.pathname;
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      var extra = search + hash;
      if (path.match(/\/readme(\.html|\.md)?$/i)) {
        window.location.replace(path.replace(/\/readme(\.html|\.md)?$/i, '/') + extra);
      } else if (path.match(/\.md$/i)) {
        window.location.replace(path.replace(/\.md$/i, '.html') + extra);
      }
    })();
  </script>
