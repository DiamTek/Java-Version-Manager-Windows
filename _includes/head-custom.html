<!-- Custom Favicon -->
<link rel="shortcut icon" type="image/x-icon" href="{{ '/assets/icon.ico' | relative_url }}">
<link rel="icon" type="image/png" sizes="128x128" href="{{ '/assets/icon.png' | relative_url }}">

<!-- Custom Styles: Smooth Scroll, Mermaid Cards, Code Copy Buttons -->
<style>
  html {
    scroll-behavior: smooth;
  }
  .mermaid {
    display: flex;
    justify-content: center;
    margin: 28px 0;
    padding: 16px;
    background: #f8f9fa;
    border: 1px solid #e1e4e8;
    border-radius: 8px;
    overflow-x: auto;
  }
  .mermaid svg {
    max-width: 100%;
    height: auto;
  }
  .highlighter-rouge {
    position: relative;
  }
  .copy-code-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.2;
    color: #586069;
    background-color: #f6f8fa;
    border: 1px solid #d1d5da;
    border-radius: 4px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s ease-in-out, background-color 0.2s, color 0.2s;
    z-index: 10;
  }
  .highlighter-rouge:hover .copy-code-btn {
    opacity: 1;
  }
  .copy-code-btn:hover {
    background-color: #e1e4e8;
    color: #24292e;
  }
  .copy-code-btn.copied {
    color: #22863a;
    border-color: #34d058;
    background-color: #dcffe4;
  }

  /* GitHub Alert Callouts (GFM Polyfill for Jekyll Cayman) */
  .main-content blockquote.gh-alert,
  blockquote.gh-alert,
  .gh-alert {
    padding: 18px 20px !important;
    margin: 20px 0 !important;
    border-left: 4px solid !important;
    border-radius: 6px !important;
    color: #24292e !important;
    font-size: 14px !important;
    line-height: 1.6 !important;
  }
  .main-content blockquote.gh-alert p,
  blockquote.gh-alert p,
  .gh-alert p {
    color: #24292e !important;
    margin-top: 0 !important;
    margin-bottom: 8px !important;
  }
  .main-content blockquote.gh-alert p:last-child,
  blockquote.gh-alert p:last-child,
  .gh-alert p:last-child {
    margin-bottom: 0 !important;
  }
  .gh-alert-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    margin-bottom: 10px;
    font-size: 14px;
  }
  .gh-alert-title svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }
  .main-content blockquote.gh-alert-note,
  blockquote.gh-alert-note,
  .gh-alert-note {
    border-left-color: #0969da !important;
    background-color: #f0f7ff !important;
  }
  .main-content blockquote.gh-alert-note .gh-alert-title,
  .gh-alert-note .gh-alert-title {
    color: #0969da !important;
  }
  .main-content blockquote.gh-alert-tip,
  blockquote.gh-alert-tip,
  .gh-alert-tip {
    border-left-color: #1a7f37 !important;
    background-color: #f0fff4 !important;
  }
  .main-content blockquote.gh-alert-tip .gh-alert-title,
  .gh-alert-tip .gh-alert-title {
    color: #1a7f37 !important;
  }
  .main-content blockquote.gh-alert-important,
  blockquote.gh-alert-important,
  .gh-alert-important {
    border-left-color: #8250df !important;
    background-color: #fbf5ff !important;
  }
  .main-content blockquote.gh-alert-important .gh-alert-title,
  .gh-alert-important .gh-alert-title {
    color: #8250df !important;
  }
  .main-content blockquote.gh-alert-warning,
  blockquote.gh-alert-warning,
  .gh-alert-warning {
    border-left-color: #9a6700 !important;
    background-color: #fff8eb !important;
  }
  .main-content blockquote.gh-alert-warning .gh-alert-title,
  .gh-alert-warning .gh-alert-title {
    color: #9a6700 !important;
  }
  .main-content blockquote.gh-alert-caution,
  blockquote.gh-alert-caution,
  .gh-alert-caution {
    border-left-color: #d1242f !important;
    background-color: #fff5f5 !important;
  }
  .main-content blockquote.gh-alert-caution .gh-alert-title,
  .gh-alert-caution .gh-alert-title {
    color: #d1242f !important;
  }
</style>

<!-- Custom Scripts: Mermaid.js Dynamic Loader, 1-Click Code Copy, & GitHub Alerts Polyfill -->
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    // 1. GitHub Alert Callout Transformer ([!NOTE], [!TIP], [!IMPORTANT], [!WARNING], [!CAUTION])
    const alertIcons = {
      NOTE: '<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8Zm8-6.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13ZM6.5 7.75A.75.75 0 0 1 7.25 7h1a.75.75 0 0 1 .75.75v2.75h.25a.75.75 0 0 1 0 1.5h-2a.75.75 0 0 1 0-1.5h.25v-2h-.25a.75.75 0 0 1-.75-.75ZM8 6a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"></path></svg>',
      TIP: '<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M8 1.5c-2.363 0-4 1.69-4 3.75 0 .984.424 1.625.984 2.304l.214.253c.223.264.47.556.673.848.284.411.537.896.621 1.49a.75.75 0 0 1-1.484.211c-.04-.282-.163-.547-.37-.847a8.456 8.456 0 0 0-.542-.68c-.084-.1-.173-.205-.268-.32C3.201 7.75 2.5 6.766 2.5 5.25 2.5 2.31 4.863 0 8 0s5.5 2.31 5.5 5.25c0 1.516-.701 2.5-1.328 3.25-.095.115-.184.22-.268.319-.18.213-.362.434-.541.681-.208.3-.33.565-.37.847a.751.751 0 0 1-1.485-.212c.084-.593.337-1.078.621-1.489.203-.292.45-.584.673-.848.075-.088.147-.173.213-.253.561-.679.985-1.32.985-2.304 0-2.06-1.637-3.75-4-3.75ZM5.75 12h4.5a.75.75 0 0 1 0 1.5h-4.5a.75.75 0 0 1 0-1.5Zm1 3h2.5a.75.75 0 0 1 0 1.5h-2.5a.75.75 0 0 1 0-1.5Z"></path></svg>',
      IMPORTANT: '<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M0 1.75C0 .784.784 0 1.75 0h12.5C15.216 0 16 .784 16 1.75v9.5A1.75 1.75 0 0 1 14.25 13H9.06l-2.573 2.573A1.458 1.458 0 0 1 4 14.543V13H1.75A1.75 1.75 0 0 1 0 11.25Zm1.75-.25a.25.25 0 0 0-.25.25v9.5c0 .138.112.25.25.25h2.5a.75.75 0 0 1 .75.75v2.19l2.72-2.72a.749.749 0 0 1 .53-.22h6a.25.25 0 0 0 .25-.25v-9.5a.25.25 0 0 0-.25-.25Zm7 2.25v2.5a.75.75 0 0 1-1.5 0v-2.5a.75.75 0 0 1 1.5 0ZM9 9a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"></path></svg>',
      WARNING: '<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M6.457 1.047c.659-1.234 2.427-1.234 3.086 0l6.082 11.378A1.75 1.75 0 0 1 14.082 15H1.918a1.75 1.75 0 0 1-1.543-2.575Zm1.763.707a.25.25 0 0 0-.44 0L1.698 13.132a.25.25 0 0 0 .22.368h12.164a.25.25 0 0 0 .22-.368Zm.53 3.996v2.5a.75.75 0 0 1-1.5 0v-2.5a.75.75 0 0 1 1.5 0ZM9 11a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"></path></svg>',
      CAUTION: '<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M4.47.22A.749.749 0 0 1 5 0h6c.199 0 .389.079.53.22l4.25 4.25c.141.14.22.331.22.53v6a.749.749 0 0 1-.22.53l-4.25 4.25A.749.749 0 0 1 11 16H5a.749.749 0 0 1-.53-.22L.22 11.53A.749.749 0 0 1 0 11V5c0-.199.079-.389.22-.53Zm.84 1.28L1.5 5.31v5.38l3.81 3.81h5.38l3.81-3.81V5.31L10.69 1.5ZM8 4a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 8 4Zm0 8a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"></path></svg>'
    };

    const alertTitles = {
      NOTE: 'Note',
      TIP: 'Tip',
      IMPORTANT: 'Important',
      WARNING: 'Warning',
      CAUTION: 'Caution'
    };

    document.querySelectorAll('blockquote').forEach((bq) => {
      const firstP = bq.querySelector('p') || bq;
      const html = firstP.innerHTML;
      const match = html.match(/^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\](?:\s*<br\s*\/?>|\s+)?/i);
      if (!match) return;

      const type = match[1].toUpperCase();
      firstP.innerHTML = html.replace(/^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\](?:\s*<br\s*\/?>|\s+)?/i, '');
      if (firstP.innerHTML.trim() === '') {
        firstP.remove();
      }

      bq.classList.add('gh-alert', `gh-alert-${type.toLowerCase()}`);

      const header = document.createElement('div');
      header.className = 'gh-alert-title';
      header.innerHTML = `${alertIcons[type]}<span>${alertTitles[type]}</span>`;

      bq.insertBefore(header, bq.firstChild);
    });

    // 2. One-Click Code Copy Buttons
    document.querySelectorAll('.highlighter-rouge').forEach((block) => {
      if (block.classList.contains('language-mermaid')) return;
      const btn = document.createElement('button');
      btn.className = 'copy-code-btn';
      btn.type = 'button';
      btn.setAttribute('aria-label', 'Copy code to clipboard');
      btn.textContent = 'Copy';
      btn.addEventListener('click', async () => {
        const code = block.querySelector('code')?.textContent || '';
        try {
          await navigator.clipboard.writeText(code.trimEnd());
          btn.textContent = 'Copied! ✓';
          btn.classList.add('copied');
          setTimeout(() => {
            btn.textContent = 'Copy';
            btn.classList.remove('copied');
          }, 2000);
        } catch {
          btn.textContent = 'Failed';
          setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
        }
      });
      block.appendChild(btn);
    });

    // 3. Dynamic Mermaid Loader
    const mermaidCodeBlocks = document.querySelectorAll('code.language-mermaid');
    if (mermaidCodeBlocks.length === 0) return;

    try {
      const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs');
      mermaid.initialize({
        startOnLoad: false,
        theme: 'default',
        securityLevel: 'loose'
      });

      for (const code of mermaidCodeBlocks) {
        const container = code.closest('.highlighter-rouge') || code.closest('pre') || code;
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = code.textContent;
        container.replaceWith(div);
      }

      await mermaid.run();
    } catch (err) {
      console.error('Failed to render Mermaid diagrams:', err);
    }
  });
</script>
