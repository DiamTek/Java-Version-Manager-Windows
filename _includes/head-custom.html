<!-- Mermaid.js support for GitHub Pages -->
<style>
  .mermaid {
    display: flex;
    justify-content: center;
    margin: 24px 0;
    overflow-x: auto;
  }
  .mermaid svg {
    max-width: 100%;
    height: auto;
  }
</style>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const mermaidCodeBlocks = document.querySelectorAll('code.language-mermaid');
    if (mermaidCodeBlocks.length === 0) return;

    try {
      const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs');
      mermaid.initialize({
        startOnLoad: false,
        theme: 'default',
        securityLevel: 'loose'
      });

      for (const code of mermaidCodeBlocks) {
        const container = code.closest('.highlighter-rouge') || code.closest('pre') || code;
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = code.textContent;
        container.replaceWith(div);
      }

      await mermaid.run();
    } catch (err) {
      console.error('Failed to render Mermaid diagrams:', err);
    }
  });
</script>
